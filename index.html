<!doctype html>
<html lang="en" data-theme="dark">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Winter Arc</title>
<meta name="description" content="Track habits, tasks and goals through your winter arc.">
<meta name="theme-color" content="#000000">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="Winter Arc">
<link rel="manifest" href="manifest.webmanifest">
<link rel="apple-touch-icon" href="icons/icon-192.png">
<link rel="stylesheet" href="css/style.css">
<link rel="icon" href="assets/emoji/snowflake.png">
<link rel="preload" href="assets/fonts/space-grotesk-400.woff2" as="font" type="font/woff2" crossorigin>
<link rel="preload" href="assets/fonts/doto-900.woff2" as="font" type="font/woff2" crossorigin>
</head>
<body>

<header class="strip">
  <span class="logo dotnum">WINTER ARC</span>
  <nav class="nav" id="nav" aria-label="Pages">
    <button class="nav-btn is-active" data-page="today"><i aria-hidden="true">1</i><span>Today</span></button>
    <button class="nav-btn" data-page="habits"><i aria-hidden="true">2</i><span>Habits</span></button>
    <button class="nav-btn" data-page="tasks"><i aria-hidden="true">3</i><span>Tasks</span></button>
    <button class="nav-btn" data-page="goals"><i aria-hidden="true">4</i><span>Goals</span></button>
    <button class="nav-btn" data-page="insights"><i aria-hidden="true">5</i><span>Insights</span></button>
  </nav>
  <div class="strip-r"><span class="clock dotnum" id="clock" aria-hidden="true"></span>
    <button class="icon-btn" id="settingsBtn" title="Settings" aria-label="Settings">
      <svg viewBox="0 0 24 24" class="ico"><circle cx="12" cy="12" r="3.2"/><path d="M19.4 15a1.6 1.6 0 0 0 .3 1.8l.1.1a2 2 0 1 1-2.8 2.8l-.1-.1a1.6 1.6 0 0 0-1.8-.3 1.6 1.6 0 0 0-1 1.5V21a2 2 0 1 1-4 0v-.1A1.6 1.6 0 0 0 9 19.4a1.6 1.6 0 0 0-1.8.3l-.1.1a2 2 0 1 1-2.8-2.8l.1-.1a1.6 1.6 0 0 0 .3-1.8 1.6 1.6 0 0 0-1.5-1H3a2 2 0 1 1 0-4h.1A1.6 1.6 0 0 0 4.6 9a1.6 1.6 0 0 0-.3-1.8l-.1-.1a2 2 0 1 1 2.8-2.8l.1.1a1.6 1.6 0 0 0 1.8.3H9a1.6 1.6 0 0 0 1-1.5V3a2 2 0 1 1 4 0v.1a1.6 1.6 0 0 0 1 1.5 1.6 1.6 0 0 0 1.8-.3l.1-.1a2 2 0 1 1 2.8 2.8l-.1.1a1.6 1.6 0 0 0-.3 1.8V9a1.6 1.6 0 0 0 1.5 1H21a2 2 0 1 1 0 4h-.1a1.6 1.6 0 0 0-1.5 1z"/></svg>
    </button>
  </div>
</header>
<main id="view" class="view"></main>

<!-- modal host -->
<div class="modal-root" id="modalRoot" hidden>
  <div class="modal-backdrop" data-close></div>
  <div class="modal" role="dialog" aria-modal="true" aria-labelledby="modalTitle">
    <div class="modal-head">
      <h2 id="modalTitle">Title</h2>
      <button class="icon-btn sm" data-close aria-label="Close">
        <svg viewBox="0 0 24 24" class="ico"><path d="m6 6 12 12M18 6 6 18"/></svg>
      </button>
    </div>
    <div id="modalBody"></div>
  </div>
</div>

<div class="toast" id="toast" hidden></div>

<script src="js/store.js"></script>
<script src="js/charts.js"></script>
<script src="js/ui.js"></script>
<script src="js/views/today.js"></script>
<script src="js/views/habits.js"></script>
<script src="js/views/tasks.js"></script>
<script src="js/views/goals.js"></script>
<script src="js/views/insights.js"></script>
<script src="js/app.js"></script>
</body>
</html>
